version: "2"

run:
  timeout: 5m
  tests: true
  issues-exit-code: 1
  go: '1.24'

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - gocritic
    - goconst
    - unconvert
    - unparam
    - gosec
    - bodyclose
    - noctx
    - rowserrcheck
    - sqlclosecheck
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    goconst:
      min-len: 3
      min-occurrences: 3
    revive:
      rules:
        - name: exported
          severity: warning
          arguments:
            - "checkPrivateReceivers"
        - name: package-comments
          disabled: true
    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
      disabled-checks:
        - whyNoLint
        - wrapperFunc
        - hugeParam
  exclusions:
    paths:
      - bin
      - vendor
      - var
      - tmp
      - docs
    rules:
      - path: ^internal/
        linters:
          - revive
        text: "exported"
      - path: _test\.go
        linters:
          - goconst
          - gosec
          - bodyclose
      - linters:
          - gosec
        text: "G104"
