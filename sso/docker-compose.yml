version: '3.9'

x-sso-common-env: &sso-common-env
  DB_HOST: ${DB_HOST:-sso-db-test}
  DB_PORT: ${DB_PORT:-5432}
  DB_USER: ${DB_USER:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:-password}
  DB_NAME: ${DB_NAME:-sso_test}
  DB_SSLMODE: ${DB_SSLMODE:-disable}

  JWT_SECRET: ${JWT_SECRET:-test-secret-key}
  JWT_TTL: ${JWT_TTL:-24h}

  ANALYTICS_KAFKA_HOST: ${ANALYTICS_KAFKA_HOST:-kafka}
  ANALYTICS_KAFKA_PORT: ${ANALYTICS_KAFKA_PORT:-29092}
  ANALYTICS_KAFKA_TOPIC: ${ANALYTICS_KAFKA_TOPIC:-analytics_events}
  ALLOW_AUTO_TOPIC_CREATION: ${ALLOW_AUTO_TOPIC_CREATION:-true}

  LOG_MODE: ${LOG_MODE:-development}
  LOG_LEVEL: ${LOG_LEVEL:-debug}
  LOG_ENCODING: ${LOG_ENCODING:-json}
  LOG_OUTPUT: ${LOG_OUTPUT:-stdout}
  LOG_ERROR_OUTPUT: ${LOG_ERROR_OUTPUT:-stderr}
  LOG_OTLP_ENABLED: ${LOG_OTLP_ENABLED:-true}
  LOG_OTLP_ENDPOINT: ${LOG_OTLP_ENDPOINT:-otel-collector:4317}
  LOG_OTLP_INSECURE: ${LOG_OTLP_INSECURE:-true}
  LOG_OTLP_SCOPE: ${LOG_OTLP_SCOPE:-}

  OTEL_ENABLED: ${OTEL_ENABLED:-true}
  OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-sso}
  OTEL_ENVIRONMENT: ${OTEL_ENVIRONMENT:-test}
  OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION:-1.0.0}
  OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment=test,service.namespace=sso}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-otel-collector:4317}
  OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-true}

services:
  sso-db-test:
    image: postgres:15.10-alpine3.20
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-sso_test}
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-sso_test}"]
      interval: 2s
      timeout: 5s
      retries: 15
    networks:
      - default

  redis:
    image: redis:7.2-alpine
    container_name: sso_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - default
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  sso-http:
    build:
      context: .
      dockerfile: Dockerfile.http
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}
        GITHUB_PAT_TOKEN: ${GITHUB_PAT_TOKEN}
        GOPRIVATE: ${GOPRIVATE:-github.com/turtlepavlo/*}
    env_file:
      - .env
    environment:
      <<: *sso-common-env
    depends_on:
      sso-db-test:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${HTTP_PORT_HOST:-8080}:8080"
    networks:
      - default
      - infra_shared
    restart: unless-stopped

  sso-grpc:
    build:
      context: .
      dockerfile: Dockerfile.grpc
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}
        GITHUB_PAT_TOKEN: ${GITHUB_PAT_TOKEN}
        GOPRIVATE: ${GOPRIVATE:-github.com/turtlepavlo/*}
    env_file:
      - .env
    environment:
      <<: *sso-common-env
    depends_on:
      sso-db-test:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${GRPC_PORT_HOST:-9090}:9090"
    networks:
      - default
      - infra_shared
    restart: unless-stopped

networks:
  infra_shared:
    external: true
    name: infra_shared

volumes:
  redis_data:
