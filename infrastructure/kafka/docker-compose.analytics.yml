services:
  zookeeper:
    image: zookeeper:3.9.2
    container_name: kafka_zookeeper
    environment:
      ZOO_MY_ID: "1"
    volumes:
      - zookeeper_data:/data
      - zookeeper_datalog:/datalog
    networks:
      - shared
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: "1"
      KAFKA_ZOOKEEPER_CONNECT: "kafka_zookeeper:2181"

      KAFKA_LISTENERS: "EXTERNAL://0.0.0.0:9092,INTERNAL://0.0.0.0:29092"
      KAFKA_ADVERTISED_LISTENERS: "EXTERNAL://localhost:9092,INTERNAL://kafka:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DELETE_TOPIC_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - shared
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cub kafka-ready -b kafka:29092 1 30"]
      interval: 5s
      timeout: 10s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.10
    container_name: elasticsearch
    environment:
      discovery.type: "single-node"
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - shared
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  kafka-connect:
    build:
      context: ./kafka-connect
    image: kafka_connect_es:7.5.0
    container_name: kafka_connect
    depends_on:
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    ports:
      - "8084:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: "kafka:29092"
      CONNECT_REST_PORT: "8083"
      CONNECT_REST_ADVERTISED_HOST_NAME: "kafka-connect"
      CONNECT_GROUP_ID: "connect_es"

      CONNECT_CONFIG_STORAGE_TOPIC: "connect_es_configs"
      CONNECT_OFFSET_STORAGE_TOPIC: "connect_es_offsets"
      CONNECT_STATUS_STORAGE_TOPIC: "connect_es_statuses"
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"

      CONNECT_KEY_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"

      CONNECT_LOG4J_ROOT_LOGLEVEL: "INFO"
      CONNECT_PLUGIN_PATH: "/usr/share/java,/usr/share/confluent-hub-components"
    networks:
      - shared
    restart: unless-stopped
    command:
      - /etc/confluent/docker/run

  kafka-connect-init:
    image: curlimages/curl:8.6.0
    container_name: kafka_connect_init
    depends_on:
      kafka-connect:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    networks:
      - shared
    restart: "no"
    entrypoint: []
    command:
      - /bin/sh
      - -ec
      - |
          set -euo pipefail

          echo "--- Wait for Kafka Connect ---"
          until [ "$(curl -s -o /dev/null -w '%{http_code}' http://kafka-connect:8083/connectors)" = "200" ]; do
            echo "waiting for connect..."
            sleep 2
          done

          echo "--- Create/Update ES sink connector ---"
          cat > /tmp/es-sink.json <<'JSON'
          {
            "name": "event-es-sink",
            "config": {
              "connector.class": "io.confluent.connect.elasticsearch.ElasticsearchSinkConnector",
              "tasks.max": "1",
              "topics": "event_service.public.events",
              "connection.url": "http://elasticsearch:9200",
              "key.ignore": "true",
              "schema.ignore": "true",
              "behavior.on.null.values": "delete",
              "type.name": "_doc",
              "consumer.override.auto.offset.reset": "earliest"
            }
          }
          JSON

          if [ "$(curl -s -o /dev/null -w '%{http_code}' http://kafka-connect:8083/connectors/event-es-sink)" = "200" ]; then
            curl -fsS -X PUT "http://kafka-connect:8083/connectors/event-es-sink/config" \
              -H "Content-Type: application/json" \
              --data-binary "@/tmp/es-sink.json"
          else
            curl -fsS -X POST "http://kafka-connect:8083/connectors" \
              -H "Content-Type: application/json" \
              --data-binary "@/tmp/es-sink.json"
          fi

  kafka-init-topics:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka_init_topics
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - shared
    restart: "no"
    entrypoint: ["/bin/bash", "-ec"]
    command: |
      set -euo pipefail

      echo "--- Wait for Kafka ---"
      cub kafka-ready -b kafka:29092 1 60

      echo "--- Create Debezium internal topics (idempotent) ---"
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
        --topic event_service_cdc_configs --partitions 1 --replication-factor 1 \
        --config cleanup.policy=compact

      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
        --topic event_service_cdc_offsets --partitions 25 --replication-factor 1 \
        --config cleanup.policy=compact

      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
        --topic event_service_cdc_statuses --partitions 5 --replication-factor 1 \
        --config cleanup.policy=compact

      echo "--- Ensure payment topic for consumer (idempotent) ---"
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
        --topic payment_events --partitions 1 --replication-factor 1

      echo "--- Enforce compact (idempotent) ---"
      kafka-configs --bootstrap-server kafka:29092 \
        --entity-type topics --entity-name event_service_cdc_configs \
        --alter --add-config cleanup.policy=compact || true

      kafka-configs --bootstrap-server kafka:29092 \
        --entity-type topics --entity-name event_service_cdc_offsets \
        --alter --add-config cleanup.policy=compact || true

      kafka-configs --bootstrap-server kafka:29092 \
        --entity-type topics --entity-name event_service_cdc_statuses \
        --alter --add-config cleanup.policy=compact || true

      echo "--- Done ---"

networks:
  shared:
    external: true
    name: infra_shared

volumes:
  kafka_data:
  zookeeper_data:
  zookeeper_datalog:
  elasticsearch_data:
